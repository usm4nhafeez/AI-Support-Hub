# ---------------------------------------------------------------------------
# PostgreSQL + pgvector profile — an alternative to the Oracle setup, not a
# replacement. Oracle remains the default: start this only with
#   SPRING_PROFILES_ACTIVE=pgvector
# The four variables below replace the three ORACLE_* ones. They are deliberately
# generic, so the same profile works with a local container, Supabase, Neon or any
# other PostgreSQL that has pgvector. Set them in upper case: on Linux the lookup
# is case-sensitive, so DB_Driver would not resolve on a deploy target.
# DB_DRIVER is the only optional one — it defaults to the PostgreSQL driver,
# because this profile's dialect, bootstrap SQL and vector store are all Postgres.
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Extensions and the clob domain have to exist before Hibernate creates the
# tables, so the script runs as part of datasource initialisation, which Spring
# Boot orders ahead of the JPA schema update and the vector-store setup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/postgres-bootstrap.sql
# The bootstrap script guards the domain creation with a DO block, which contains
# ordinary semicolons, so statements are separated by ";;" instead.
spring.sql.init.separator=;;

# In this profile Oracle is the one that gets switched off.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.oracle.autoconfigure.OracleVectorStoreAutoConfiguration

# pgvector can index at most 2000 dimensions with HNSW, so this profile asks
# Gemini for 1536-wide vectors while Oracle keeps the 3072-wide default.
# Vectors are not portable between the two: knowledge has to be trained again
# on whichever database a project is pointed at.
spring.ai.google.genai.embedding.text.dimensions=1536

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=cosine-distance
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
