spring.application.name=ai-support-hub
server.port=${PORT:8000}

# Knowledge file uploads (PDF/Markdown). Spring's default 1MB per-file cap made
# larger PDFs abort the connection mid-upload ("Failed to fetch" in the browser).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ---------------------------------------------------------------------------
# Which database this build uses.
#
# The value below makes PostgreSQL + pgvector the out-of-the-box database, so a
# deployment needs only DB_URL / DB_USERNAME / DB_PASSWORD and no profile
# variable at all. Everything in the rest of this file is the Oracle setup, and
# application-pgvector.properties overrides just the database keys on top of it.
#
# To run on Oracle, set the environment variable SPRING_PROFILES_ACTIVE=oracle.
# An environment variable outranks this line, and there is no
# application-oracle.properties, so no profile file loads and the Oracle
# settings here apply exactly as they always did.
# ---------------------------------------------------------------------------
spring.profiles.active=pgvector

# Oracle datasource — used when SPRING_PROFILES_ACTIVE is not "pgvector". Inside
# a Docker container, localhost is the container itself, so point at the host
# instead: ORACLE_URL=jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

spring.ai.vectorstore.oracle.initialize-schema=true
spring.ai.vectorstore.oracle.remove-existing-vector-store-table=false
spring.ai.vectorstore.oracle.dimensions=3072
spring.ai.vectorstore.oracle.distance-type=COSINE
spring.ai.vectorstore.oracle.index-type=IVF

# Both vector-store starters are on the classpath so one image can serve either
# database. This file switches off the PostgreSQL store; the pgvector profile
# replaces that value with the Oracle store switched off instead. Lists like this
# are replaced, not merged, so exactly one VectorStore bean ever exists.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Required: use a random value of at least 32 bytes.
support.security.jwt-secret=${JWT_SECRET}
support.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}
# Demo seeding never stores placeholder credentials: leave DEMO_API_KEY /
# DEMO_AGENT_PASSWORD unset and those rows are skipped with a warning.
support.demo.enabled=${DEMO_SEED_ENABLED:true}
support.demo.client-key=${DEMO_CLIENT_KEY:demo-client}
support.demo.api-key=${DEMO_API_KEY:}
support.demo.agent-username=${DEMO_AGENT_USERNAME:admin}
support.demo.agent-password=${DEMO_AGENT_PASSWORD:}

## Keep Hibernate errors and suppress SQL/debug noise
#logging.level.org.hibernate=ERROR
#logging.level.org.hibernate.SQL=OFF
#logging.level.org.hibernate.orm.jdbc.bind=OFF
#logging.level.org.hibernate.orm.jdbc.extract=OFF
#
## Suppress Spring AI request/response debug noise
#logging.level.org.springframework.ai=INFO
## Suppress Spring framework debug logs
#logging.level.org.springframework=INFO

#app.ai.system-prompt=You are a helpful technical assistant. Explain concepts clearly and use simple examples.